<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>neutrino</title>
<style>
:root{--bg:#0f141b;--panel:#182028;--line:#28323d;--txt:#dbe4ee;--mut:#8fa0b3;--accent:#4f9cf0;--ok:#3fb97f;--warn:#e0a23c;--off:#6b7a8c;--danger:#e0655f}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);margin:0}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--panel:#fff;--line:#dde4ec;--txt:#1c2733;--mut:#64748b}}
a{color:var(--accent)}
.layout{display:flex;min-height:100vh}
.side{width:200px;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side h1{font-size:18px;margin:0 0 16px 8px}
.side button{background:none;border:0;color:var(--mut);text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer}
.side button.on{background:var(--accent);color:#fff}
.main{flex:1;padding:24px;max-width:1080px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
th{color:var(--mut);font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px}
.b-ok{background:rgba(63,185,127,.15);color:var(--ok)}
.b-warn{background:rgba(224,162,60,.15);color:var(--warn)}
.b-off{background:rgba(107,122,140,.2);color:var(--off)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:var(--danger)}
.btn:disabled{opacity:.5}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;width:440px;max-width:92vw}
.modal label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
.modal input,.modal select{width:100%}
.modal input[type=checkbox]{width:auto;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 16px;min-width:220px}
.toast.err{border-left-color:var(--danger)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:320px;font-size:12px}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut)}
.hidden{display:none!important}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.topbar h2{margin:0;flex:1}
.statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat .k{color:var(--mut);font-size:12px}
.stat .v{font-size:20px;font-weight:700;margin-top:4px}
.seg{display:flex;gap:4px}
.seg button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
canvas.chart{width:100%;height:260px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.legend{display:flex;gap:16px;color:var(--mut);font-size:13px;margin:8px 2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:99px;margin-right:6px}
</style>
</head><body>
<div id="login" class="layout" style="align-items:center;justify-content:center">
<div class="card" style="width:320px"><h2>neutrino 登录</h2>
<p><input id="user" value="admin" placeholder="user" style="width:100%"></p>
<p><input id="pass" type="password" placeholder="pass" style="width:100%"></p>
<p><button class="btn" onclick="login()" style="width:100%">登录</button></p>
<p id="loginmsg" style="color:var(--danger)"></p></div></div>
<div id="app" class="layout hidden">
<nav class="side"><h1>neutrino <span id="ver" style="font-size:12px;color:var(--mut);font-weight:400"></span></h1>
<button id="nav-ov" class="on" onclick="tab('ov')">总览</button>
<button id="nav-tn" onclick="tab('tn')">隧道</button>
<button id="nav-tr" onclick="tab('tr')">流量</button>
<button id="nav-cn" onclick="tab('cn')">连接</button>
<button id="nav-log" onclick="tab('log')">日志</button></nav>
<main class="main">
<section id="sec-ov">
<div class="topbar"><h2>Agents</h2><button class="btn ghost" onclick="refresh()">刷新</button></div>
<div class="card"><table id="agents"></table></div>
</section>
<section id="sec-tn" class="hidden">
<div class="topbar"><h2>隧道</h2>
<select id="hostsel" onchange="loadDesired()"></select>
<button class="btn" onclick="openForm()">+ 新增隧道</button>
<button class="btn ghost" onclick="reloadDesired()">从文件重载</button></div>
<div class="card"><table id="tunnels"></table></div>
<details><summary>高级：JSON 直推（热更新，不断线）</summary>
<div class="card"><div class="row">
<input id="cfgagent" placeholder="hostname 或 agent_id，空=全部">
<button class="btn ghost" onclick="pushConfig()">推送下方 JSON</button><span id="cfgmsg"></span></div>
<textarea id="cfgjson" rows="8" style="width:100%;font-family:monospace;margin-top:8px">{"proxies":[]}</textarea></div>
</details>
</section>
<section id="sec-tr" class="hidden">
<div class="topbar"><h2>流量</h2>
<select id="trtunnel" onchange="loadTraffic()"></select>
<div class="seg" id="trseg">
<button data-g="min" class="on" onclick="setGran('min')">分</button><button data-g="hour" onclick="setGran('hour')">时</button><button data-g="day" onclick="setGran('day')">天</button>
</div></div>
<div class="statcards">
<div class="stat"><div class="k" id="tr-rx-k">最近1分钟 rx</div><div class="v" id="tr-rx">-</div></div>
<div class="stat"><div class="k" id="tr-tx-k">最近1分钟 tx</div><div class="v" id="tr-tx">-</div></div>
<div class="stat"><div class="k" id="tr-peak-k">单桶峰值（rx+tx）</div><div class="v" id="tr-peak">-</div></div>
<div class="stat"><div class="k" id="tr-sum-k">近3小时总量（rx/tx）</div><div class="v" id="tr-sum" style="font-size:15px">-</div></div>
</div>
<div class="card" style="margin-bottom:10px"><div style="font-size:12px;color:var(--mut)">实时速率（5s 快照 · 每5s刷新）</div><div id="live" style="font-size:13px;margin-top:4px">-</div></div>
<div class="legend"><span><span class="dot" style="background:#4f9cf0"></span>rx 上行</span><span><span class="dot" style="background:#3fb97f"></span>tx 下行</span><span id="tr-hint"></span></div>
<canvas class="chart" id="chart" width="960" height="260"></canvas>
</section>
<section id="sec-cn" class="hidden">
<div class="topbar"><h2>连接 <span id="cn-count" class="badge b-ok">0</span></h2><button class="btn ghost" onclick="loadConns()">刷新</button></div>
<div class="card"><table id="conns"></table></div>
</section>
<section id="sec-log" class="hidden">
<div class="topbar"><h2>日志</h2></div>
<div class="card"><pre id="logs"></pre></div>
</section>
</main></div>
<div id="formwrap" class="modal hidden"><div class="box">
<h3 id="formtitle">新增隧道</h3>
<label>名称</label><input id="f-name" placeholder="如 web">
<label>类型</label><select id="f-type" onchange="typeFields()">
<option value="http">http（域名路由）</option><option value="tcp">tcp（端口）</option>
<option value="https">https（TLS 透传）</option><option value="udp">udp（端口）</option><option value="link">link（跨 agent）</option></select>
<label id="l-dom">域名（逗号分隔）</label><input id="f-dom" placeholder="a.example.com">
<label id="l-port" class="hidden">公网端口 remote_port</label><input id="f-port" class="hidden" type="number" placeholder="如 2222">
<label id="l-link-agent" class="hidden">对端 agent（出口 agent 的主机名）</label><select id="f-link-agent" class="hidden"></select>
<label id="l-link-tgt" class="hidden">对端目标（出口 agent 本机视角的 ip:port）</label><div id="f-link-tgt" class="hidden"><input id="f-link-ip" placeholder="如 192.168.1.10"><input id="f-link-port" type="number" placeholder="如 3306"></div>
<label id="l-ip">目标 IP（agent 本机视角：填 agent 所在机器能访问的地址，127.0.0.1 = agent 本机）</label><input id="f-ip" value="127.0.0.1">
<label id="l-lport">目标端口（agent 本机视角）</label><input id="f-lport" type="number" placeholder="如 80">
<label>入口 Basic 认证（可选，http 隧道：浏览器先弹框登录才放行；格式 user:pass，transmission 这类无登录页的最合适。留空=不校验）</label><input id="f-basic" placeholder="如 admin:一串随机口令" autocomplete="off">
<label id="l-rate">下行限速（可选，仅 tcp/udp/link 总量：如 0.5m=0.5MB/s、500k；留空=不限速；口径与 transmission 显示一致）</label><input id="f-rate" placeholder="如 0.5m">
<label><input type="checkbox" id="f-en" checked> 启用</label>
<div class="row" style="margin-top:16px;justify-content:flex-end">
<button class="btn ghost" onclick="closeForm()">取消</button>
<button class="btn" onclick="saveForm()">保存</button></div>
</div></div>
<div id="toast"></div>
<script>
let auth='', editing=null, desiredCache=[], trGran='min';
function toast(m,err){ const d=document.createElement('div'); d.className='toast'+(err?' err':''); d.textContent=m;
  document.getElementById('toast').appendChild(d); setTimeout(()=>d.remove(),4000); }
function hdrs(ct){ const h={}; if(auth) h['Authorization']='Bearer '+auth; if(ct) h['Content-Type']='application/json'; return h; }
function tab(t){ for(const x of ['ov','tn','tr','cn','log']){ document.getElementById('sec-'+x).classList.toggle('hidden',x!==t);
  document.getElementById('nav-'+x).classList.toggle('on',x===t); }
  if(t==='tr') loadTraffic(); if(t==='cn') loadConns(); }
async function login(){
  const user=document.getElementById('user').value, pass=document.getElementById('pass').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user,pass})});
  if(r.ok){ const j=await r.json(); auth=j.token||'';
    try{ if(auth) sessionStorage.setItem('nt_auth',auth); }catch(e){}
    document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
    refresh();setInterval(refresh,5000);
  } else document.getElementById('loginmsg').textContent='login failed';
}
async function need(u){ const r=await fetch(u,{headers:hdrs(),credentials:'same-origin'}); if(r.status===401){location.reload();throw 0;} return r.json(); }
async function refresh(){
  try{
  const o=await need('/api/overview');
  if(o.version) document.getElementById('ver').textContent='('+o.version+')';
  const sel=document.getElementById('hostsel');
  const cur=sel.value;
  sel.innerHTML=o.agents.map(a=>`<option ${a.hostname===cur?'selected':''}>${a.hostname}</option>`).join('')||'<option value="">(无在线 agent)</option>';
  document.getElementById('agents').innerHTML='<tr><th>hostname</th><th>id</th><th>ver</th><th>RTT(ms)</th><th>在线(s)</th><th>rx/tx</th></tr>'+
    o.agents.map(a=>`<tr><td>${a.hostname}</td><td>${a.agent_id}</td><td>${a.version}</td><td>${a.rtt_ms}</td><td>${a.online_secs}</td><td>${human(a.rx_bytes)}/${human(a.tx_bytes)}</td></tr>`).join('')||'<tr><td colspan=6>暂无</td></tr>';
  await loadDesired(false);
  const t=await need('/api/tunnels');
  document.getElementById('tunnels').innerHTML='<tr><th>agent</th><th>name</th><th>type</th><th>domains/ports</th><th>target</th><th>限速</th><th>状态</th><th>操作</th></tr>'+t.tunnels.map(x=>{
    const isLink=x.type==='link';
    const where=isLink?'-':`${x.domains&&x.domains.length?x.domains.join(','):''}${x.remote_port?':'+x.remote_port:''}`;
    const tgt=isLink?`${x.link_agent||'?'}→${x.link_host||'?'}:${x.link_port||'?'}`:x.target;
    const live=o.agents.some(a=>a.agent_id===x.agent_id||a.hostname===x.agent);
    const st=!x.enabled?'<span class="badge b-off">已禁用</span>':(live?'<span class="badge b-ok">生效中</span>':'<span class="badge b-warn">待同步</span>');
    const btn=x.enabled?`<button class="btn ghost" onclick="toggle('${x.agent_id}','${x.name}',false)">禁用</button>`:`<button class="btn ghost" onclick="toggle('${x.agent_id}','${x.name}',true)">启用</button>`;
    const ed=`<button class="btn ghost" onclick='editRow(${JSON.stringify(x).replace(/'/g,"&#39;")})'>编辑</button>`;
    const del=`<button class="btn ghost" onclick="delRow('${x.name}')">删除</button>`;
    return `<tr><td>${x.agent}</td><td>${x.name}</td><td>${isLink?'<span class="badge b-ok">link</span>':x.type}</td><td>${where}</td><td>${tgt}</td><td>${x.rate_limit||'-'}</td><td>${st}</td><td>${btn} ${ed} ${del}</td></tr>`;}).join('')||'<tr><td colspan=8>暂无</td></tr>';
  const l=await need('/api/logs');
  document.getElementById('logs').textContent=l.logs.join('\n');
  if(!document.getElementById('sec-tr').classList.contains('hidden')) loadTraffic();
  if(!document.getElementById('sec-cn').classList.contains('hidden')) loadConns();
  }catch(e){}
}
function human(n){ if(n<1024) return n+'B'; if(n<1048576) return (n/1024).toFixed(1)+'K'; if(n<1073741824) return (n/1048576).toFixed(1)+'M'; return (n/1073741824).toFixed(2)+'G'; }
function setGran(g){ trGran=g; for(const b of document.querySelectorAll('#trseg button')) b.classList.toggle('on',b.dataset.g===g); loadTraffic(); }
async function loadLive(){
  try{
  const t=await need('/api/tunnels');
  const sel=document.getElementById('trtunnel');
  const tun=sel&&sel.value?sel.value:'all';
  const j=await need(`/api/live?tunnel=${encodeURIComponent(tun)}`);
  const rows=j.live||[];
  document.getElementById('live').innerHTML=rows.length?rows.map(r=>`${r.tunnel} <b>${human(r.rx_s)}/s</b> / <b>${human(r.tx_s)}/s</b>`).join('&nbsp;&nbsp;·&nbsp;&nbsp;'):'暂无流量（等待下一 5s tick）';
  }catch(e){}
}
setInterval(()=>{ if(!document.getElementById('sec-tr').classList.contains('hidden')) loadLive(); },5000);
async function loadTraffic(){
  try{
  const t=await need('/api/tunnels');
  const sel=document.getElementById('trtunnel'), cur=sel.value||'all';
  const keys=[...new Set(t.tunnels.filter(x=>x.enabled).map(x=>`${x.agent}/${x.name}`))];
  sel.innerHTML='<option value="all">全部汇总</option>'+keys.map(k=>`<option ${k===cur?'selected':''}>${k}</option>`).join('');
  const tun=sel.value||'all';
  const n=trGran==='min'?180:(trGran==='hour'?168:31);
  const j=await need(`/api/traffic?tunnel=${encodeURIComponent(tun)}&gran=${trGran}&n=${n}`);
  const pts=j.points||[];
  const sum=pts.reduce((a,p)=>[a[0]+p[1],a[1]+p[2]],[0,0]);
  const last=pts.length?pts[pts.length-1]:[0,0,0];
  const peak=pts.reduce((a,p)=>Math.max(a,p[1]+p[2]),0);
  // 卡片标题随粒度联动，消除“周期/窗口”歧义：桶时长与查询范围写明白。
  const bucket=trGran==='min'?'1分钟':(trGran==='hour'?'1小时':'1天');
  const span=trGran==='min'?'近3小时':(trGran==='hour'?'近7天':'近31天');
  const rate=s=>human(Math.round(s/(trGran==='min'?60:(trGran==='hour'?3600:86400))))+'/s';
  document.getElementById('tr-rx-k').textContent=`最近${bucket} rx（均速 ${rate(last[1])}）`;
  document.getElementById('tr-tx-k').textContent=`最近${bucket} tx（均速 ${rate(last[2])}）`;
  document.getElementById('tr-peak-k').textContent=`单${bucket}峰值（rx+tx）`;
  document.getElementById('tr-sum-k').textContent=`${span}总量（rx/tx）`;
  document.getElementById('tr-rx').textContent=human(last[1]);
  document.getElementById('tr-tx').textContent=human(last[2]);
  document.getElementById('tr-peak').textContent=human(peak);
  document.getElementById('tr-sum').textContent=`${human(sum[0])} / ${human(sum[1])}`;
  document.getElementById('tr-hint').textContent=pts.length?`${span}共 ${pts.length} 点 · 每点${bucket}`:'暂无数据（等待下一分钟 tick）';
  drawChart(pts);
  loadLive();
  }catch(e){}
}
function drawChart(pts){
  const c=document.getElementById('chart'), ctx=c.getContext('2d');
  const W=c.width, H=c.height, pad=34;
  ctx.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.body);
  const grid=cs.getPropertyValue('--line').trim()||'#28323d', mut=cs.getPropertyValue('--mut').trim()||'#8fa0b3';
  ctx.strokeStyle=grid; ctx.fillStyle=mut; ctx.font='11px system-ui'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=pad+(H-2*pad)*i/4; ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-8,y); ctx.stroke(); }
  if(!pts.length){ ctx.fillText('暂无数据',W/2-30,H/2); return; }
  const max=Math.max(1,...pts.map(p=>p[1]+p[2]));
  const X=i=>pad+(W-pad-8)*(pts.length===1?0:i/(pts.length-1));
  const Y=v=>(H-pad)-(H-2*pad)*v/max;
  const step=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{ if(i%step!==0&&i!==pts.length-1) return;
    const d=new Date(p[0]*1000);
    const lb=trGran==='day'?`${d.getMonth()+1}-${d.getDate()}`:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    ctx.fillText(lb,X(i)-14,H-10); });
  for(let i=0;i<=4;i++){ const v=max*(4-i)/4; ctx.fillText(human(Math.round(v)),2,pad+(H-2*pad)*i/4+4); }
  const line=(idx,color)=>{ ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.beginPath();
    pts.forEach((p,i)=>{ const x=X(i),y=Y(p[idx]); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); };
  line(1,'#4f9cf0'); line(2,'#3fb97f');
}
function dur(s){ s=Math.max(0,s|0); if(s<60) return s+'s'; if(s<3600) return (s/60|0)+'m'+(s%60?s%60+'s':''); return (s/3600|0)+'h'+((s%3600/60|0)?(s%3600/60|0)+'m':''); }
async function loadConns(){
  try{
  const j=await need('/api/conns');
  const rows=(j.conns||[]).slice().sort((a,b)=>b.since-a.since);
  document.getElementById('cn-count').textContent=rows.length;
  const now=Date.now()/1000|0;
  document.getElementById('conns').innerHTML='<tr><th>外部</th><th>公网端口</th><th>协议</th><th>隧道/agent</th><th>内网目标</th><th>时长</th><th>rx/tx</th></tr>'+rows.map(c=>{
    const pb=c.proto==='udp'?'<span class="badge b-warn">udp</span>':c.proto;
    return `<tr><td>${c.peer}</td><td>${c.public_port}</td><td>${pb}</td><td>${c.tunnel||'-'} / ${c.agent}</td><td>${c.target}</td><td>${dur(now-c.since)}</td><td>${human(c.rx)}/${human(c.tx)}</td></tr>`;}).join('')||'<tr><td colspan=7>当前无连接</td></tr>';
  }catch(e){}
}
async function loadDesired(showMsg){
  const h=document.getElementById('hostsel').value;
  if(!h) return;
  const d=await need('/api/desired/'+encodeURIComponent(h)); // need 自带 credentials

  desiredCache=d.proxies||[];
  if(showMsg!==false) toast(`已加载 ${h} 的 ${desiredCache.length} 条期望配置`);
}
async function reloadDesired(){
  const r=await fetch('/api/desired/reload',{method:'POST',headers:hdrs(true),credentials:'same-origin'});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){ toast(`已重载 ${j.reloaded} 条，跳过 ${j.skipped} 条，推送 ${j.pushed} 个 agent`); refresh(); }
  else toast('重载失败: '+(j.reason||r.status),true);
}
function typeFields(){
  const t=document.getElementById('f-type').value, isHttp=(t==='http'), isLink=(t==='link');
  document.getElementById('l-dom').classList.toggle('hidden',!isHttp);
  document.getElementById('f-dom').classList.toggle('hidden',!isHttp);
  document.getElementById('l-port').classList.toggle('hidden',isHttp||isLink);
  document.getElementById('f-port').classList.toggle('hidden',isHttp||isLink);
  for(const id of ['l-link-agent','f-link-agent','l-link-tgt','f-link-tgt'])
    document.getElementById(id).classList.toggle('hidden',!isLink);
  document.getElementById('l-rate').classList.toggle('hidden',isHttp);
  document.getElementById('f-rate').classList.toggle('hidden',isHttp);
  document.getElementById('l-ip').textContent=isLink?'本监听地址（入口 agent 上起监听：0.0.0.0=入口内网可达，127.0.0.1=仅本机）':'目标 IP（agent 本机视角：填 agent 所在机器能访问的地址，127.0.0.1 = agent 本机）';
  document.getElementById('l-lport').textContent=isLink?'本监听端口':'目标端口（agent 本机视角）';
  if(isLink){
    // 对端下拉=在线 agents（除自己）；根因→修法：自环在保存时也拦（见 saveForm）。
    const self=document.getElementById('hostsel').value;
    need('/api/overview').then(o=>{
      const sel=document.getElementById('f-link-agent');
      const cur=sel.value;
      sel.innerHTML=(o.agents||[]).filter(a=>a.hostname!==self)
        .map(a=>`<option ${a.hostname===cur?'selected':''}>${a.hostname}</option>`).join('')||'<option value="">(无其他在线 agent)</option>';
    }).catch(()=>{});
  }
}
function openForm(){ editing=null; document.getElementById('formtitle').textContent='新增隧道';
  for(const id of ['f-name','f-dom','f-ip','f-lport','f-basic','f-rate','f-link-ip','f-link-port']) document.getElementById(id).value=(id==='f-ip'?'127.0.0.1':'');
  document.getElementById('f-link-agent').innerHTML='';
  document.getElementById('f-en').checked=true; typeFields();
  document.getElementById('formwrap').classList.remove('hidden'); }
function closeForm(){ document.getElementById('formwrap').classList.add('hidden'); }
function editRow(x){ editing=x.name;
  document.getElementById('formtitle').textContent='编辑 '+x.name;
  document.getElementById('f-name').value=x.name;
  document.getElementById('f-type').value=x.type||'http'; typeFields();
  document.getElementById('f-dom').value=(x.domains||[]).join(',');
  document.getElementById('f-port').value=x.remote_port||'';
  document.getElementById('f-basic').value=x.basic_auth||'';
  document.getElementById('f-link-ip').value=x.link_host||'';
  document.getElementById('f-link-port').value=x.link_port||'';
  document.getElementById('f-rate').value=x.rate_limit||'';
  const tgt=(x.target||'').split(':'); document.getElementById('f-ip').value=tgt[0]||'127.0.0.1';
  document.getElementById('f-lport').value=tgt[1]||'';
  if((x.type||'')==='link'){ const sel=document.getElementById('f-link-agent'); sel.innerHTML=`<option>${x.link_agent||''}</option>`; sel.value=x.link_agent||''; }
  document.getElementById('f-en').checked=!!x.enabled;
  document.getElementById('formwrap').classList.remove('hidden'); }
function curProxy(){
  const t=document.getElementById('f-type').value;
  const basic=document.getElementById('f-basic').value.trim();
  const p={name:document.getElementById('f-name').value.trim(),type:t,
    local_ip:document.getElementById('f-ip').value.trim()||'127.0.0.1',
    local_port:parseInt(document.getElementById('f-lport').value||'0'),
    domains:t==='http'?document.getElementById('f-dom').value.split(',').map(s=>s.trim()).filter(Boolean):[],
    remote_port:t==='http'?0:parseInt(document.getElementById('f-port').value||'0'),
    enabled:document.getElementById('f-en').checked};
  if(t==='http'&&basic) p.basic_auth=basic;
  if(t==='link'){ p.link_agent=document.getElementById('f-link-agent').value.trim();
    p.link_host=document.getElementById('f-link-ip').value.trim();
    p.link_port=parseInt(document.getElementById('f-link-port').value||'0'); }
  if(t!=='http'){ const rl=document.getElementById('f-rate').value.trim(); if(rl) p.rate_limit=rl; }
  return p;
}
async function saveForm(){
  const h=document.getElementById('hostsel').value;
  if(!h){ toast('先选 agent',true); return; }
  const p=curProxy();
  if(!p.name){ toast('名称必填',true); return; }
  if(p.type==='http'&&!p.domains.length){ toast('http 隧道域名必填',true); return; }
  if(p.type==='link'){
    if(!p.link_agent){ toast('对端 agent 必填',true); return; }
    if(p.link_agent===h){ toast('link 对端不能是自己',true); return; }
    if(!p.link_host||!p.link_port){ toast('对端目标 ip:port 必填',true); return; }
    if(!p.local_port){ toast('本监听端口必填',true); return; }
  } else {
    if(!p.remote_port&&p.type!=='http'){ toast('此类隧道公网端口必填',true); return; }
    if(!p.local_port){ toast('内网目标端口必填',true); return; }
  }
  let list=desiredCache.slice();
  const i=list.findIndex(q=>q.name===(editing||p.name));
  if(editing&&editing!==p.name) { const j=list.findIndex(q=>q.name===editing); if(j>=0) list.splice(j,1); }
  if(i>=0) list[i]=p; else list.push(p);
  const r=await fetch('/api/desired/'+encodeURIComponent(h),{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({proxies:list})});
  if(r.ok){ toast('已保存并下发'); closeForm(); refresh(); }
  else { const j=await r.json().catch(()=>({})); toast('保存失败: '+(j.reason||r.status),true); }
}
async function delRow(name){
  const h=document.getElementById('hostsel').value;
  if(!confirm('删除隧道 '+name+'？')) return;
  const list=desiredCache.filter(q=>q.name!==name);
  const r=await fetch('/api/desired/'+encodeURIComponent(h),{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({proxies:list})});
  if(r.ok){ toast('已删除'); refresh(); } else toast('删除失败',true);
}
async function toggle(agent,name,enabled){
  const r=await fetch(`/api/tunnels/${agent}/${name}/enabled`,{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify({enabled})});
  if(!r.ok) toast('toggle failed',true); else refresh();
}
async function pushConfig(){
  const agent=document.getElementById('cfgagent').value;
  let body; try{ body=JSON.parse(document.getElementById('cfgjson').value); }catch(e){ toast('JSON 非法',true); return; }
  body.hostname=body.hostname||agent||undefined; body.agent_id=body.agent_id||undefined;
  const r=await fetch('/api/config',{method:'POST',headers:hdrs(true),credentials:'same-origin',body:JSON.stringify(body)});
  document.getElementById('cfgmsg').textContent=r.ok?'已推送':'推送失败 '+r.status;
  if(r.ok) refresh();
}
// 刷新续登：cookie（nt_session, HttpOnly）浏览器自动带，内存 token 丢了也能续；
// 同 tab 回退 sessionStorage（cookie 被清但 tab 未关时）。任一失败才回登录页。
(async function boot(){
  try{ auth=sessionStorage.getItem('nt_auth')||''; }catch(e){ auth=''; }
  try{
    const r=await fetch('/api/overview',{headers:hdrs(),credentials:'same-origin'});
    if(!r.ok) return;
    document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
    refresh();setInterval(refresh,5000);
  }catch(e){}
})();
</script></body></html>
