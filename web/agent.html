<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>neutrino agent</title>
<style>
:root{--bg:#0f141b;--panel:#182028;--line:#28323d;--txt:#dbe4ee;--mut:#8fa0b3;--accent:#4f9cf0;--ok:#3fb97f;--warn:#e0a23c;--off:#6b7a8c;--danger:#e0655f}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);margin:0}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--panel:#fff;--line:#dde4ec;--txt:#1c2733;--mut:#64748b}}
.layout{display:flex;min-height:100vh}
.side{width:200px;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.side h1{font-size:18px;margin:0 0 16px 8px}
.side button{background:none;border:0;color:var(--mut);text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;cursor:pointer}
.side button.on{background:var(--accent);color:#fff}
.main{flex:1;padding:24px;max-width:1080px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
th{color:var(--mut);font-weight:600}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px}
.b-ok{background:rgba(63,185,127,.15);color:var(--ok)}
.b-warn{background:rgba(224,162,60,.15);color:var(--warn)}
.b-off{background:rgba(107,122,140,.2);color:var(--off)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:14px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
.hidden{display:none!important}
.topbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.topbar h2{margin:0;flex:1}
#toast{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 16px;min-width:220px}
.toast.err{border-left-color:var(--danger)}
.corner{font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:8px;padding:4px 10px}
</style>
</head><body>
<div id="login" class="layout" style="align-items:center;justify-content:center">
<div class="card" style="width:320px"><h2>agent 登录</h2>
<p><input id="user" value="admin" placeholder="user"></p>
<p><input id="pass" type="password" placeholder="pass"></p>
<p><button class="btn" onclick="login()" style="width:100%">登录</button></p>
<p id="loginmsg" style="color:var(--danger)"></p></div></div>
<div id="app" class="layout hidden">
<nav class="side"><h1>agent</h1>
<button id="nav-ov" class="on" onclick="tab('ov')">状态</button>
<button id="nav-tn" onclick="tab('tn')">隧道</button>
<button id="nav-set" onclick="tab('set')">设置</button></nav>
<main class="main">
<section id="sec-ov">
<div class="topbar"><h2>上行状态</h2><button class="btn ghost" onclick="refresh()">刷新</button></div>
<div class="card"><dl class="kv" id="stat"></dl></div>
</section>
<section id="sec-tn" class="hidden">
<div class="topbar"><h2>生效中的隧道</h2><span class="corner">由 server 下发 · 只读</span></div>
<div class="card"><table id="tunnels"></table></div>
</section>
<section id="sec-set" class="hidden">
<div class="topbar"><h2>设置</h2></div>
<div class="card" style="max-width:440px">
<p style="color:var(--mut);font-size:13px">上行 server 地址修改后需重启 agent 生效；管理口令即时生效。</p>
<label>上行 server 地址（当前）</label><input id="s-server" readonly>
<label>管理口令（留空=不改）</label><input id="s-pass" type="password" placeholder="新口令">
<div style="margin-top:16px;text-align:right"><button class="btn" onclick="save()">保存</button></div>
</div>
</section>
</main></div>
<div id="toast"></div>
<script>
let auth='';
function toast(m,err){ const d=document.createElement('div'); d.className='toast'+(err?' err':''); d.textContent=m;
  document.getElementById('toast').appendChild(d); setTimeout(()=>d.remove(),4000); }
function hdrs(ct){ const h={}; if(auth) h['Authorization']='Bearer '+auth; if(ct) h['Content-Type']='application/json'; return h; }
function tab(t){ for(const x of ['ov','tn','set']){ document.getElementById('sec-'+x).classList.toggle('hidden',x!==t);
  document.getElementById('nav-'+x).classList.toggle('on',x===t); } }
async function login(){
  const user=document.getElementById('user').value, pass=document.getElementById('pass').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user,pass})});
  if(r.ok){ const j=await r.json(); auth=j.token||'';
    document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
    refresh();setInterval(refresh,5000);
  } else document.getElementById('loginmsg').textContent='login failed';
}
async function refresh(){
  try{
  const r=await fetch('/api/status',{headers:hdrs()});
  if(r.status===401){location.reload();return;}
  const s=await r.json();
  const on=s.online;
  document.getElementById('stat').innerHTML=
    `<dt>上行</dt><dd>${s.server_url||'-'}</dd>`+
    `<dt>连接</dt><dd>${on?'<span class="badge b-ok">在线</span>':'<span class="badge b-warn">连接中…</span>'}</dd>`+
    `<dt>RTT</dt><dd>${s.rtt_ms??'-'} ms</dd>`+
    `<dt>重连次数</dt><dd>${s.reconnects??0}</dd>`+
    `<dt>生效隧道</dt><dd>${(s.proxies||[]).length} 条</dd>`;
  document.getElementById('s-server').value=s.server_url||'';
  document.getElementById('tunnels').innerHTML='<tr><th>name</th><th>type</th><th>目标</th><th>domains/ports</th><th>状态</th></tr>'+
    (s.proxies||[]).map(p=>{
      const where=`${(p.domains||[]).join(',')}${p.remote_port?':'+p.remote_port:''}`;
      const st=p.enabled?'<span class="badge b-ok">启用</span>':'<span class="badge b-off">禁用</span>';
      return `<tr><td>${p.name}</td><td>${p.type}</td><td>${p.local_ip}:${p.local_port}</td><td>${where}</td><td>${st}</td></tr>`;}).join('')||'<tr><td colspan=5>暂无（等待 server 下发）</td></tr>';
  }catch(e){}
}
async function save(){
  const np=document.getElementById('s-pass').value;
  const r=await fetch('/api/settings',{method:'POST',headers:hdrs(true),body:JSON.stringify({new_pass:np||undefined})});
  if(r.ok){ toast('已保存'+((await r.json()).note||'')); document.getElementById('s-pass').value=''; }
  else toast('保存失败',true);
}
</script></body></html>
