name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target $TARGET

      - name: Smoke test
        run: ./target/$TARGET/release/neutrino --help

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then VER="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          cd target/$TARGET/release
          tar czf neutrino-$VER-$TARGET.tar.gz neutrino
          sha256sum neutrino-$VER-$TARGET.tar.gz > neutrino-$VER-$TARGET.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: neutrino-${{ env.VERSION }}-$TARGET
          path: target/${{ env.TARGET }}/release/neutrino-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz*

      # 只在打 tag (v*) 时发布到 GitHub Release
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/${{ env.TARGET }}/release/neutrino-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz*
