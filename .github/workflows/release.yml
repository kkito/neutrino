name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use-zig: false
          - target: aarch64-unknown-linux-musl
            use-zig: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (native x86_64)
        if: ${{ !matrix.use-zig }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install zigbuild (aarch64 cross)
        if: ${{ matrix.use-zig }}
        run: pip install ziglang && cargo install cargo-zigbuild

      - name: Build
        run: |
          if [ "${{ matrix.use-zig }}" = "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Smoke test (x86_64 only)
        if: ${{ !matrix.use-zig }}
        run: ./target/${{ matrix.target }}/release/neutrino --help

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf neutrino-${{ matrix.target }}.tar.gz neutrino
          sha256sum neutrino-${{ matrix.target }}.tar.gz > neutrino-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: neutrino-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/neutrino-${{ matrix.target }}.tar.gz*

      # 只在打 tag (v*) 时发布到 GitHub Release
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/${{ matrix.target }}/release/neutrino-${{ matrix.target }}.tar.gz*
