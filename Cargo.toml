[package]
name = "neutrino"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "neutrino"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
http = "1"
base64 = "0.22"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.26"
futures-util = "0.3"
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"

bcrypt = "0.15"
axum-test = "17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
anyhow = "1"
libc = "0.2"
thiserror = "1"
toml = "0.8"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
quinn = { version = "0.11", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"

[dev-dependencies]
# e2e cookie 续登测试用（主包不开 cookies 避免二进制膨胀）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json", "cookies"] }
