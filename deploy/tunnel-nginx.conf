# tunnel.nat.kkito.cn — WSS 入口 + WebUI（泛域名证书）
# 单端口：/ws（agent）、/（WebUI）、其余按隧道 Host 路由到 agent
# 外部访问: https://tunnel.nat.kkito.cn:7443/ (WebUI), wss://tunnel.nat.kkito.cn:7443/ws (agent)
server {
    listen 443 ssl;
    server_name tunnel.nat.kkito.cn;
    ssl_certificate /etc/nginx-certs/wildcard.nat.kkito.cn.crt;
    ssl_certificate_key /etc/nginx-certs/wildcard.nat.kkito.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # 同一 upstream：Host=tunnel.nat.kkito.cn 走 WebUI，业务域名走隧道
        proxy_pass http://127.0.0.1:7440;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
# 业务域名：照此逐个加，仅 Host 不同，全部指到同一 neutrino 端口，由它按 Host 路由：
