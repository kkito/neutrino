# neutrino 日志留存（spec §16.6）
#
# 部署位置：
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald-neutrino.conf /etc/systemd/journald.conf.d/neutrino.conf
#   sudo systemctl restart systemd-journald
#
# 为什么不写在 service 单元里：留存上限是 journald 全局的，
# service 单元的 LogRateLimit 之类管不到滚动与保留。
#
# 验证：
#   journalctl --disk-usage          # 应 <= 500M
#   journalctl -u neutrino-server --since "-30 days" --no-pager | head -1

[Journal]
# 为什么要有上限：2026-10-23 事故时 journal 只剩 2 天，根因不是没有文件，
# 而是 journald 未配上限导致滚动过快——按 800 条/分钟的 INFO 日志量，
# 不设上限两天就把盘刷满。
SystemMaxUse=500M
MaxRetentionSec=30day
# 单条日志长度上限。UDP 流收尾行带多个计数（sid/lived/reason/rx/tx/truncated/pool），
# 默认 8K 够用，显式写清便于后续调整。
MaxLineLen=16K
