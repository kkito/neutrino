# neutrino 日志留存配置（spec §15.5）
#
# 安装：
#   cp deploy/journald-neutrino.conf /etc/systemd/journald.conf.d/
#   systemctl restart systemd-journald
#
# 根因：2026-10-23 kudus 重传风暴事故后排查，发现 journal 只保留 2 天
# （--disk-usage 4.0G，最早一条 2026-10-21T06:05），事故窗口日志差点丢失。
# journald 默认不设上限，按磁盘总量自动滚动；BT 刷屏日志吞吐大时会很快冲掉。
#
# 说明：
# - SystemMaxUse=500M：上限固定，避免日志把磁盘吃满；500M 够存 30 天正常量。
# - MaxRetentionSec=30day：强制按时间保留，即使没到 500M 也不删 30 天内的。
# 两者取「先触发者」——任一条件满足即开始清理。
[Journal]
SystemMaxUse=500M
MaxRetentionSec=30day
